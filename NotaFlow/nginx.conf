server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Sem Cache-Control aqui de propósito. O gateway é a única origem e o
    # AntiforgeryMiddleware carimba "no-cache, no-store" em toda resposta segura
    # para publicar o XSRF-TOKEN — qualquer política de cache definida aqui seria
    # anulada na combinação dos dois headers. Ver CLAUDE.md.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
