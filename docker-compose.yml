name: emissor-nf

services:

  # ---------------------------------------------------------------- gateway
  gateway-db:
    image: postgres:17-alpine
    container_name: emissor-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: emissor
      POSTGRES_PASSWORD: emissor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissor -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [emissor]

  gateway:
    build:
      context: ./API-Gateway
      dockerfile: Gateway/Dockerfile
    container_name: emissor-gateway
    profiles: [app]
    restart: unless-stopped
    depends_on:
      gateway-db:
        condition: service_healthy
      notaflow:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__GatewayDb: "Host=gateway-db;Port=5432;Database=gateway;Username=emissor;Password=emissor"
      Cors__Origins__0: "http://localhost:4200"
      ReverseProxy__Clusters__estoque__Destinations__primary__Address: "http://estoque:8080/"
      ReverseProxy__Clusters__faturamento__Destinations__primary__Address: "http://faturamento:8080/"
      ReverseProxy__Clusters__notaflow__Destinations__primary__Address: "http://notaflow:8080/"
    ports:
      - "127.0.0.1:5000:8080"
    networks: [emissor]

  # --------------------------------------------------------------- notaflow
  # Sem porta publicada de propósito: o acesso é sempre pelo gateway, na 5000.
  # Mesma origem evita CORS e mantém o cookie de sessão SameSite=Strict.
  notaflow:
    build:
      context: ./NotaFlow
      dockerfile: Dockerfile
    container_name: emissor-notaflow
    profiles: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [emissor]

  # ------------------------------------------------------------ faturamento
  faturamento-db:
    image: postgres:17-alpine
    container_name: emissor-faturamento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: faturamento
      POSTGRES_USER: emissor
      POSTGRES_PASSWORD: emissor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - faturamento-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissor -d faturamento"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [emissor]

  faturamento:
    build:
      context: ./API-Faturamento
      dockerfile: Faturamento.Api/Dockerfile
    container_name: emissor-faturamento
    profiles: [app]
    restart: unless-stopped
    depends_on:
      faturamento-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__FaturamentoDb: "Host=faturamento-db;Port=5432;Database=faturamento;Username=emissor;Password=emissor"
      ConnectionStrings__RabbitMq: "amqp://Admin:Admin@rabbitmq:5672/emissor"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "127.0.0.1:5108:8080"
    networks: [emissor]

  # ---------------------------------------------------------------- estoque
  estoque-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: emissor-estoque-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # exigência do SQL Server: 8+ com maiúscula, minúscula, dígito e símbolo
      MSSQL_SA_PASSWORD: "Emissor@Dev2026"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - estoque-db-data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
        -P "Emissor@Dev2026" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [emissor]

  estoque:
    build:
      context: ./API-Estoque
      dockerfile: Estoque.Api/Dockerfile
    container_name: emissor-estoque
    profiles: [app]
    restart: unless-stopped
    depends_on:
      estoque-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__EstoqueDb: "Server=estoque-db,1433;Database=estoque;User Id=sa;Password=Emissor@Dev2026;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__RabbitMq: "amqp://Admin:Admin@rabbitmq:5672/emissor"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "127.0.0.1:5247:8080"
    networks: [emissor]

  # --------------------------------------------------------------- rabbitmq
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: emissor-rabbitmq
    restart: unless-stopped
    hostname: emissor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: Admin
      RABBITMQ_DEFAULT_PASS: Admin
      RABBITMQ_DEFAULT_VHOST: emissor
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [emissor]

volumes:
  gateway-db-data:
  faturamento-db-data:
  estoque-db-data:
  rabbitmq-data:

networks:
  emissor:
    driver: bridge
