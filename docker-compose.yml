name: emissor-nf

services:

  # ---------------------------------------------------------------- gateway
  gateway-db:
    image: postgres:17-alpine
    container_name: emissor-gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: emissor
      POSTGRES_PASSWORD: emissor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissor -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [emissor]

  # ------------------------------------------------------------ faturamento
  faturamento-db:
    image: postgres:17-alpine
    container_name: emissor-faturamento-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: faturamento
      POSTGRES_USER: emissor
      POSTGRES_PASSWORD: emissor
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - faturamento-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissor -d faturamento"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [emissor]

  # ---------------------------------------------------------------- estoque
  estoque-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: emissor-estoque-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # exigência do SQL Server: 8+ com maiúscula, minúscula, dígito e símbolo
      MSSQL_SA_PASSWORD: "Emissor@Dev2026"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - estoque-db-data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
        -P "Emissor@Dev2026" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [emissor]

  # --------------------------------------------------------------- rabbitmq
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: emissor-rabbitmq
    restart: unless-stopped
    hostname: emissor-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: Admin
      RABBITMQ_DEFAULT_PASS: Admin
      RABBITMQ_DEFAULT_VHOST: emissor
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks: [emissor]

volumes:
  gateway-db-data:
  faturamento-db-data:
  estoque-db-data:
  rabbitmq-data:

networks:
  emissor:
    driver: bridge
